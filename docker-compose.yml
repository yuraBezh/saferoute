services:
  postgres:
    image: postgres:17-alpine
    container_name: saferoute-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: saferoute
      POSTGRES_PASSWORD: saferoute
      POSTGRES_DB: saferoute
    ports:
      - "5434:5432"
    volumes:
      - saferoute-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saferoute"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  saferoute-pgdata:
