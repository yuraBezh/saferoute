services:
  postgres-e2e:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: saferoute_e2e
      POSTGRES_USER: saferoute_e2e
      POSTGRES_PASSWORD: saferoute_e2e
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saferoute_e2e -d saferoute_e2e"]
      interval: 2s
      timeout: 3s
      retries: 15
